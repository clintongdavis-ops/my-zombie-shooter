<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Backyard Defense Prototype</title>
    <style>
        body {
            background-color: #2c3e50;
            color: #ecf0f1;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        canvas {
            background-color: #27ae60;
            border: 4px solid #2ecc71;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            cursor: pointer;
        }
        .ui-bar {
            margin-bottom: 15px;
            font-size: 20px;
            font-weight: bold;
        }
        button {
            background-color: #34495e;
            color: white;
            border: 2px solid transparent;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            margin: 0 5px;
        }
        button.active {
            border-color: #f1c40f;
            background-color: #f39c12;
        }
        #energy-display {
            color: #f1c40f;
            margin-right: 20px;
        }
    </style>
</head>
<body>

    <div class="ui-bar">
        <span id="energy-display">☀️ Energy: 200</span>
        <button id="btn-seedling" class="active" onclick="selectPlant('seedling')">🌱 Indoor Seedling (50)</button>
        <button id="btn-beatboxer" onclick="selectPlant('beatboxer')">📻 Boom Bap Beatboxer (100)</button>
    </div>

    <canvas id="gameCanvas" width="900" height="500"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const cellSize = 100;
        
        let energy = 200;
        let frame = 0;
        let selectedPlant = 'seedling';
        let gameOver = false;

        const plants = [];
        const zombies = [];
        const projectiles = [];
        const floatingSuns = [];

        // Update UI
        function updateUI() {
            document.getElementById('energy-display').innerText = `☀️ Energy: ${energy}`;
            document.getElementById('btn-seedling').className = selectedPlant === 'seedling' ? 'active' : '';
            document.getElementById('btn-beatboxer').className = selectedPlant === 'beatboxer' ? 'active' : '';
        }

        function selectPlant(type) {
            selectedPlant = type;
            updateUI();
        }

        // Draw the Front Yard Grid
        function drawGrid() {
            for (let y = 0; y < canvas.height; y += cellSize) {
                for (let x = 0; x < canvas.width; x += cellSize) {
                    ctx.strokeStyle = 'rgba(0, 0, 0, 0.1)';
                    ctx.strokeRect(x, y, cellSize, cellSize);
                }
            }
        }

        // Classes
        class Plant {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.width = cellSize;
                this.height = cellSize;
                this.type = type;
                this.health = 100;
                
                if (type === 'seedling') {
                    this.cost = 50;
                    this.symbol = '🌱';
                } else if (type === 'beatboxer') {
                    this.cost = 100;
                    this.symbol = '📻';
                }
            }
            draw() {
                ctx.font = '50px Arial';
                ctx.fillText(this.symbol, this.x + 20, this.y + 70);
            }
            update() {
                if (this.type === 'seedling' && frame % 300 === 0) {
                    energy += 25; // Generates energy
                }
                if (this.type === 'beatboxer' && frame % 100 === 0) {
                    // Shoot soundwave if zombie in lane
                    let zombieInLane = zombies.some(z => z.y === this.y && z.x > this.x);
                    if (zombieInLane) {
                        projectiles.push(new Projectile(this.x + 60, this.y + 35));
                    }
                }
            }
        }

        class Projectile {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 30;
                this.height = 30;
                this.speed = 5;
                this.damage = 20;
            }
            draw() {
                ctx.font = '30px Arial';
                ctx.fillText('🎵', this.x, this.y + 25);
            }
            update() {
                this.x += this.speed;
            }
        }

        class Zombie {
            constructor(y) {
                this.x = canvas.width;
                this.y = y;
                this.width = cellSize;
                this.height = cellSize;
                this.speed = 0.5;
                this.health = 100;
            }
            draw() {
                ctx.font = '50px Arial';
                ctx.fillText('🧟', this.x + 20, this.y + 70);
            }
            update() {
                this.x -= this.speed;
                if (this.x < 0) {
                    gameOver = true;
                }
            }
        }

        // Mouse Click to Plant
        canvas.addEventListener('click', function(e) {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            const gridX = Math.floor(mouseX / cellSize) * cellSize;
            const gridY = Math.floor(mouseY / cellSize) * cellSize;

            // Check if cell is empty
            if (plants.some(p => p.x === gridX && p.y === gridY)) return;

            let cost = selectedPlant === 'seedling' ? 50 : 100;
            if (energy >= cost) {
                plants.push(new Plant(gridX, gridY, selectedPlant));
                energy -= cost;
            }
        });

        // Main Game Loop
        function animate() {
            if (gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0,0, canvas.width, canvas.height);
                ctx.fillStyle = 'white';
                ctx.font = '60px Arial';
                ctx.fillText('ZOMBIES ATE YOUR BRAINS!', 50, canvas.height/2);
                return;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGrid();

            // Spawn Zombies
            if (frame % 400 === 0) {
                let randomLane = Math.floor(Math.random() * 5) * cellSize;
                zombies.push(new Zombie(randomLane));
            }

            // Update & Draw Plants
            for (let i = 0; i < plants.length; i++) {
                plants[i].update();
                plants[i].draw();
            }

            // Update & Draw Projectiles
            for (let i = 0; i < projectiles.length; i++) {
                projectiles[i].update();
                projectiles[i].draw();
                
                // Collision with zombies
                for (let j = 0; j < zombies.length; j++) {
                    if (projectiles[i] && zombies[j] &&
                        projectiles[i].x < zombies[j].x + zombies[j].width &&
                        projectiles[i].x + projectiles[i].width > zombies[j].x &&
                        projectiles[i].y > zombies[j].y && projectiles[i].y < zombies[j].y + zombies[j].height) {
                        
                        zombies[j].health -= projectiles[i].damage;
                        projectiles.splice(i, 1);
                        i--;
                        
                        if (zombies[j].health <= 0) {
                            zombies.splice(j, 1);
                        }
                        break;
                    }
                }
                
                if (projectiles[i] && projectiles[i].x > canvas.width) {
                    projectiles.splice(i, 1);
                    i--;
                }
            }

            // Update & Draw Zombies
            for (let i = 0; i < zombies.length; i++) {
                let zombie = zombies[i];
                let isEating = false;

                // Collision with plants
                for (let j = 0; j < plants.length; j++) {
                    if (zombie.x < plants[j].x + plants[j].width &&
                        zombie.x + zombie.width > plants[j].x &&
                        zombie.y === plants[j].y) {
                        
                        isEating = true;
                        plants[j].health -= 0.5;
                        if (plants[j].health <= 0) {
                            plants.splice(j, 1);
                        }
                    }
                }

                if (!isEating) {
                    zombie.update();
                }
                zombie.draw();
            }

            updateUI();
            frame++;
            requestAnimationFrame(animate);
        }

        // Start Game
        animate();
    </script>
</body>
</html>
