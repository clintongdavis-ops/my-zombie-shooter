<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Backyard Defense: Top-Down Edition</title>
    <style>
        body {
            background-color: #1a252f;
            color: #ecf0f1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 10px;
            user-select: none;
        }
        #game-container {
            position: relative;
            display: inline-block;
        }
        canvas {
            background-color: #27ae60;
            border: 4px solid #2ecc71;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            cursor: crosshair;
        }
        .ui-bar {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
            max-width: 720px;
            margin-left: auto;
            margin-right: auto;
        }
        button {
            background-color: #34495e;
            color: white;
            border: 2px solid transparent;
            padding: 8px 12px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.2s;
        }
        button:hover { background-color: #3d566e; }
        button.active { border-color: #f1c40f; background-color: #f39c12; }
        #energy-display {
            color: #f1c40f;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            padding: 0 15px;
        }
        #start-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        #start-btn {
            font-size: 24px; padding: 15px 30px; background-color: #e74c3c; border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="ui-bar">
        <div id="energy-display">☀️ 300</div>
        <button id="btn-seedling" class="active" onclick="selectPlant('seedling')">🌱 Seedling (50)</button>
        <button id="btn-beatboxer" onclick="selectPlant('beatboxer')">📻 Beatboxer (100)</button>
        <button id="btn-flinger" onclick="selectPlant('flinger')">🌳 Flinger (150)</button>
        <button id="btn-nematode" onclick="selectPlant('nematode')">🦠 Nematode Trap (75)</button>
        <button id="btn-duo" onclick="selectPlant('duo')">👦 Dynamic Duo (200)</button>
        <button id="btn-bomb" onclick="selectPlant('bomb')">💣 Bass Bomb (150)</button>
    </div>

    <div id="game-container">
        <div id="start-screen">
            <h1>BACKYARD DEFENSE</h1>
            <p>Defend the house in the center!</p>
            <button id="start-btn">START GAME (Enable Audio)</button>
        </div>
        <canvas id="gameCanvas" width="720" height="720"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const cellSize = 80; // 9x9 grid = 720x720
        
        let energy = 300; 
        let frame = 0;
        let selectedPlant = 'seedling';
        let gameOver = false;
        let gameStarted = false;

        const plants = [];
        const zombies = [];
        const projectiles = [];
        const floatingSuns = [];
        const explosions = [];

        // Audio Context (Synthesized Sounds)
        let audioCtx;
        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            playBeat();
        }

        function playBeat() {
            if (!audioCtx) return;
            const tempo = 90; 
            const beatDuration = 60 / tempo;
            let time = audioCtx.currentTime;
            
            // Simple loop trigger
            setInterval(() => {
                if(gameOver) return;
                playKick(audioCtx.currentTime);
                playHiHat(audioCtx.currentTime + beatDuration / 2);
                playSnare(audioCtx.currentTime + beatDuration);
                playHiHat(audioCtx.currentTime + beatDuration * 1.5);
                
                // Random zombie groan
                if(Math.random() < 0.2 && zombies.length > 0) playGroan();
            }, beatDuration * 2 * 1000);
        }

        function playKick(time) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(150, time);
            osc.frequency.exponentialRampToValueAtTime(0.01, time + 0.5);
            gain.gain.setValueAtTime(1, time);
            gain.gain.exponentialRampToValueAtTime(0.01, time + 0.5);
            osc.start(time); osc.stop(time + 0.5);
        }

        function playSnare(time) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(250, time);
            gain.gain.setValueAtTime(0.5, time);
            gain.gain.exponentialRampToValueAtTime(0.01, time + 0.2);
            osc.start(time); osc.stop(time + 0.2);
        }

        function playHiHat(time) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(8000, time);
            gain.gain.setValueAtTime(0.1, time);
            gain.gain.exponentialRampToValueAtTime(0.01, time + 0.1);
            osc.start(time); osc.stop(time + 0.1);
        }

        function playGroan() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(60, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 1.5);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1.5);
            osc.start(); osc.stop(audioCtx.currentTime + 1.5);
        }

        function playExplosion() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(100, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        }

        // Start Button
        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('start-screen').style.display = 'none';
            initAudio();
            gameStarted = true;
            animate();
        });

        function updateUI() {
            document.getElementById('energy-display').innerText = `☀️ ${energy}`;
            const btns = ['seedling', 'beatboxer', 'flinger', 'nematode', 'duo', 'bomb'];
            btns.forEach(b => {
                document.getElementById(`btn-${b}`).className = selectedPlant === b ? 'active' : '';
            });
        }

        function selectPlant(type) { selectedPlant = type; updateUI(); }

        function drawGridAndHouse() {
            for (let y = 0; y < canvas.height; y += cellSize) {
                for (let x = 0; x < canvas.width; x += cellSize) {
                    ctx.strokeStyle = 'rgba(0, 0, 0, 0.2)';
                    ctx.strokeRect(x, y, cellSize, cellSize);
                }
            }
            // Draw House (Center 3x3 Grid)
            ctx.fillStyle = '#8e44ad';
            ctx.fillRect(3 * cellSize, 3 * cellSize, 3 * cellSize, 3 * cellSize);
            ctx.fillStyle = '#9b59b6';
            ctx.fillRect(3 * cellSize + 10, 3 * cellSize + 10, 3 * cellSize - 20, 3 * cellSize - 20);
            ctx.fillStyle = 'white';
            ctx.font = '30px Arial';
            ctx.fillText('🏠 HOME', 3 * cellSize + 50, 4 * cellSize + 40);
        }

        // Classes
        class FloatingSun {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.targetX = 10; this.targetY = 10; // Moves to top left UI area
                this.speed = 4;
            }
            draw() {
                ctx.font = '40px Arial';
                ctx.fillText('☀️', this.x, this.y);
            }
            update() {
                let dx = this.targetX - this.x;
                let dy = this.targetY - this.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                if(dist < this.speed) {
                    energy += 25;
                    updateUI();
                    return true; // Reached target
                }
                this.x += (dx / dist) * this.speed;
                this.y += (dy / dist) * this.speed;
                return false;
            }
        }

        class Plant {
            constructor(x, y, type) {
                this.x = x; this.y = y;
                this.width = cellSize; this.height = cellSize;
                this.type = type;
                this.health = 100;
                this.timer = 0;
                
                const stats = {
                    'seedling': { cost: 50, sym: '🌱' },
                    'beatboxer': { cost: 100, sym: '📻' },
                    'flinger': { cost: 150, sym: '🌳', hp: 150 },
                    'nematode': { cost: 75, sym: '🦠', hp: 50 },
                    'duo': { cost: 200, sym: '👦' },
                    'bomb': { cost: 150, sym: '💣' }
                };
                this.cost = stats[type].cost;
                this.symbol = stats[type].sym;
                if(stats[type].hp) this.health = stats[type].hp;
                this.maxHealth = this.health;
            }
            draw() {
                ctx.font = '40px Arial';
                // Shake bomb
                let drawX = this.x + 20; let drawY = this.y + 55;
                if (this.type === 'bomb') {
                    if (this.timer % 10 < 5) drawX += 2; else drawX -= 2;
                }
                ctx.fillText(this.symbol, drawX, drawY);
                
                // Health Bar
                ctx.fillStyle = 'red';
                ctx.fillRect(this.x + 10, this.y + 65, 60, 5);
                ctx.fillStyle = '#2ecc71';
                ctx.fillRect(this.x + 10, this.y + 65, 60 * (this.health / this.maxHealth), 5);
            }
            update() {
                this.timer++;
                if (this.type === 'seedling' && this.timer % 300 === 0) {
                    floatingSuns.push(new FloatingSun(this.x, this.y));
                }
                
                if (this.type === 'beatboxer' && this.timer % 90 === 0) {
                    projectiles.push(new Projectile(this.x + 40, this.y + 40, 'music', this.getDirection()));
                }

                if (this.type === 'flinger' && this.timer % 180 === 0) {
                    projectiles.push(new Projectile(this.x + 40, this.y + 40, 'fruit', this.getDirection()));
                }

                if (this.type === 'duo' && this.timer % 100 === 0) {
                    projectiles.push(new Projectile(this.x + 40, this.y + 40, 'music', 'UP'));
                    projectiles.push(new Projectile(this.x + 40, this.y + 40, 'music', 'DOWN'));
                    projectiles.push(new Projectile(this.x + 40, this.y + 40, 'music', 'LEFT'));
                    projectiles.push(new Projectile(this.x + 40, this.y + 40, 'music', 'RIGHT'));
                }

                if (this.type === 'bomb' && this.timer >= 90) { // Explodes after 1.5s (90 frames)
                    this.explode();
                    this.health = 0; // Destroy self
                }
            }

            getDirection() {
                // Find nearest zombie to aim at
                let target = null; let minDist = Infinity;
                zombies.forEach(z => {
                    let d = Math.abs(z.x - this.x) + Math.abs(z.y - this.y);
                    if (d < minDist) { minDist = d; target = z; }
                });
                if (!target) return 'UP';
                if (Math.abs(target.x - this.x) > Math.abs(target.y - this.y)) {
                    return target.x > this.x ? 'RIGHT' : 'LEFT';
                } else {
                    return target.y > this.y ? 'DOWN' : 'UP';
                }
            }

            explode() {
                playExplosion();
                explosions.push({x: this.x + 40, y: this.y + 40, radius: 0, maxRadius: 150}); // ~3x3 grid
                for (let i = 0; i < zombies.length; i++) {
                    let dx = zombies[i].x + 40 - (this.x + 40);
                    let dy = zombies[i].y + 40 - (this.y + 40);
                    if (Math.sqrt(dx*dx + dy*dy) <= 150) {
                        zombies[i].health -= 500; // Massive damage
                    }
                }
            }
        }

        class Projectile {
            constructor(x, y, type, direction) {
                this.x = x; this.y = y; this.type = type;
                this.vx = 0; this.vy = 0;
                
                let speed = type === 'music' ? 6 : 4;
                if(direction === 'UP') this.vy = -speed;
                if(direction === 'DOWN') this.vy = speed;
                if(direction === 'LEFT') this.vx = -speed;
                if(direction === 'RIGHT') this.vx = speed;

                this.damage = type === 'music' ? 20 : 60;
                this.symbol = type === 'music' ? '🎵' : '🍎';
            }
            draw() {
                ctx.font = '25px Arial';
                ctx.fillText(this.symbol, this.x - 10, this.y + 10);
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
            }
        }

        class Zombie {
            constructor(lane, side, type) {
                this.width = cellSize; this.height = cellSize;
                this.type = type;
                this.side = side; // TOP, LEFT, RIGHT
                this.timer = 0;

                // Set spawn position based on side
                if(side === 'TOP') { this.x = lane; this.y = -cellSize; this.vx = 0; this.vy = 1; }
                if(side === 'LEFT') { this.x = -cellSize; this.y = lane; this.vx = 1; this.vy = 0; }
                if(side === 'RIGHT') { this.x = canvas.width; this.y = lane; this.vx = -1; this.vy = 0; }

                const stats = {
                    'shuffler': { spd: 0.5, hp: 100, col: '#7f8c8d' },
                    'mechanic': { spd: 0.3, hp: 300, col: '#95a5a6' },
                    'glitcher': { spd: 0.6, hp: 80, col: '#e056fd' },
                    'sprinter': { spd: 1.2, hp: 60, col: '#e74c3c' },
                    'boss': { spd: 0.2, hp: 800, col: '#c0392b', size: 1.5 }
                };
                this.baseSpeed = stats[type].spd;
                this.health = stats[type].hp;
                this.maxHealth = this.health;
                this.color = stats[type].col;
                this.sizeMod = stats[type].size || 1;
                this.slowTimer = 0;
            }
            
            draw() {
                ctx.save();
                ctx.translate(this.x + 40, this.y + 40);
                
                // Rotate to face movement
                if (this.side === 'TOP') ctx.rotate(Math.PI);
                if (this.side === 'LEFT') ctx.rotate(-Math.PI/2);
                if (this.side === 'RIGHT') ctx.rotate(Math.PI/2);

                // Draw Top-Down Body
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(0, 10, 25 * this.sizeMod, 0, Math.PI * 2); // Shoulders
                ctx.fill();
                ctx.fillStyle = '#27ae60'; // Zombie Green Head
                ctx.beginPath();
                ctx.arc(0, -10, 15 * this.sizeMod, 0, Math.PI * 2);
                ctx.fill();

                if (this.type === 'mechanic') {
                    ctx.fillStyle = '#7f8c8d'; // Shield
                    ctx.fillRect(-30, -35, 60, 15);
                }

                ctx.restore();

                // Draw Health Bar
                ctx.fillStyle = 'black';
                ctx.fillRect(this.x + 10, this.y - 10, 60, 5);
                ctx.fillStyle = this.slowTimer > 0 ? '#3498db' : 'red';
                ctx.fillRect(this.x + 10, this.y - 10, 60 * (Math.max(0, this.health) / this.maxHealth), 5);
            }

            update() {
                this.timer++;
                let currentSpeed = this.baseSpeed;
                
                if(this.slowTimer > 0) {
                    currentSpeed *= 0.3; // Slowed down by Nematode
                    this.slowTimer--;
                    this.health -= 0.1; // Poison tick
                }

                if(this.type === 'glitcher' && this.timer % 150 === 0) {
                    // Jump forward
                    this.x += this.vx * 40;
                    this.y += this.vy * 40;
                }

                this.x += this.vx * currentSpeed;
                this.y += this.vy * currentSpeed;

                // Hit house? Center is grids (3,3) to (5,5) -> pixel 240 to 480
                if (this.x > 200 && this.x < 480 && this.y > 200 && this.y < 480) {
                    gameOver = true;
                }
            }
        }

        // Mouse Click
        canvas.addEventListener('click', function(e) {
            if(!gameStarted) return;
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            const gridX = Math.floor(mouseX / cellSize) * cellSize;
            const gridY = Math.floor(mouseY / cellSize) * cellSize;

            // Prevent planting inside the house
            if (gridX >= 240 && gridX <= 400 && gridY >= 240 && gridY <= 400) return;

            // Check if occupied
            if (plants.some(p => p.x === gridX && p.y === gridY)) return;

            const costs = { 'seedling': 50, 'beatboxer': 100, 'flinger': 150, 'nematode': 75, 'duo': 200, 'bomb': 150 };
            let cost = costs[selectedPlant];

            if (energy >= cost) {
                plants.push(new Plant(gridX, gridY, selectedPlant));
                energy -= cost;
                updateUI();
            }
        });

        function animate() {
            if (gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.8)';
                ctx.fillRect(0,0, canvas.width, canvas.height);
                ctx.fillStyle = 'red';
                ctx.font = '50px Arial';
                ctx.fillText('THEY GOT IN THE HOUSE!', 50, canvas.height/2);
                return;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGridAndHouse();

            // Spawning Logic
            let spawnRate = Math.max(80, 250 - Math.floor(frame / 60)); 
            if (frame % spawnRate === 0) {
                let sides = ['TOP', 'LEFT', 'RIGHT'];
                let side = sides[Math.floor(Math.random() * sides.length)];
                
                // Spawn on grid 3, 4, or 5
                let laneGrid = 3 + Math.floor(Math.random() * 3);
                let lanePixel = laneGrid * cellSize;

                let rand = Math.random();
                let type = 'shuffler';
                if (rand < 0.1) type = 'boss';
                else if (rand < 0.25) type = 'sprinter';
                else if (rand < 0.4) type = 'glitcher';
                else if (rand < 0.6) type = 'mechanic';

                zombies.push(new Zombie(lanePixel, side, type));
            }

            // Plants
            for (let i = 0; i < plants.length; i++) {
                plants[i].update();
                plants[i].draw();
            }

            // Suns
            for (let i = 0; i < floatingSuns.length; i++) {
                if(floatingSuns[i].update()) {
                    floatingSuns.splice(i, 1);
                    i--;
                } else {
                    floatingSuns[i].draw();
                }
            }

            // Projectiles
            for (let i = 0; i < projectiles.length; i++) {
                projectiles[i].update();
                projectiles[i].draw();
                
                let hit = false;
                for (let j = 0; j < zombies.length; j++) {
                    if (Math.abs(projectiles[i].x - (zombies[j].x + 40)) < 40 && 
                        Math.abs(projectiles[i].y - (zombies[j].y + 40)) < 40) {
                        zombies[j].health -= projectiles[i].damage;
                        hit = true;
                        if (zombies[j].health <= 0) zombies.splice(j, 1);
                        break;
                    }
                }
                
                if (hit || projectiles[i].x < 0 || projectiles[i].x > canvas.width || projectiles[i].y < 0 || projectiles[i].y > canvas.height) {
                    projectiles.splice(i, 1);
                    i--;
                }
            }

            // Explosions (Visuals)
            for (let i = 0; i < explosions.length; i++) {
                let exp = explosions[i];
                ctx.beginPath();
                ctx.arc(exp.x, exp.y, exp.radius, 0, Math.PI*2);
                ctx.fillStyle = `rgba(231, 76, 60, ${1 - exp.radius/exp.maxRadius})`;
                ctx.fill();
                exp.radius += 10;
                if(exp.radius >= exp.maxRadius) { explosions.splice(i, 1); i--; }
            }

            // Zombies & Eating
            for (let i = 0; i < zombies.length; i++) {
                let zombie = zombies[i];
                let isEating = false;

                for (let j = 0; j < plants.length; j++) {
                    if (Math.abs(zombie.x - plants[j].x) < 50 && Math.abs(zombie.y - plants[j].y) < 50) {
                        if (plants[j].type === 'nematode') {
                            zombie.slowTimer = 300; // 5 seconds of slow & poison
                            plants[j].health = 0; // Trap triggers and dies
                        } else {
                            isEating = true;
                            plants[j].health -= 0.1; // Slowed down eating speed!
                        }
                        
                        if (plants[j].health <= 0) plants.splice(j, 1);
                        break;
                    }
                }

                if (!isEating) zombie.update();
                zombie.draw();
            }

            frame++;
            requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
